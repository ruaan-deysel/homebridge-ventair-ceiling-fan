# Dependabot (tinkerologie standard: see STANDARDS.md in tinkerologie/.github)
version: 2

updates:
  # Keeps the SHA-pinned actions in ci.yml/release.yml/publish.yml current. Pinning to a
  # commit is what makes those workflows immutable; Dependabot is what stops that pin
  # from silently rotting, and it rewrites both the SHA and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Homebridge and its HAP library are peer dependencies whose major versions are a
      # deliberate compatibility decision (v2 support was the point of this branch), not
      # something to bump automatically.
      - dependency-name: homebridge
        update-types: [version-update:semver-major]
      - dependency-name: hap-nodejs
        update-types: [version-update:semver-major]
      # A TypeScript major is a compiler upgrade, not a dependency bump: it changes what
      # compiles and reliably fails CI until the code is adapted. Do it deliberately.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node should describe the oldest supported Node (engines: ^22.12.0); a newer
      # major lets tsc accept APIs that do not exist on Node 22.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
