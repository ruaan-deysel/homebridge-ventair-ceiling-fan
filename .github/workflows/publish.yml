name: Publish

# Publishes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN secret is involved.
# npm mints a short-lived credential from this workflow's OIDC identity, which is why
# the filename, the repository and the `release` environment below must keep matching
# the trusted publisher registered on the npm package.
#
# Runs only when a GitHub release is published, so tagging alone does not publish:
# Release.yml creates the release from CHANGELOG.md, and publishing stays a deliberate act.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: this is what npm exchanges for a publish credential

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm 11.5.1+; Node 24 ships an older npm.
      - run: npm install -g npm@latest

      - run: npm ci

      # Re-run the full gate here rather than trusting the CI run on the commit: this is
      # the last point before the package is public and immutable.
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

      # Refuse to publish a package whose version does not match the release tag, which
      # would otherwise silently ship the wrong version under the right release notes.
      - name: Verify package version matches the release tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag ($TAG) does not match package.json version ($PKG)." >&2
            exit 1
          fi

      - run: npm publish --provenance --access public
